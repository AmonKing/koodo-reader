name: check-readest-arm64

# One-off fitness check: can Readest's aarch64 AppImage run on an intranet
# UOS V20 (Debian 10, glibc 2.28) arm64 machine?
# Criteria: (1) no hard runtime dependency on system libwebkit2gtk,
#           (2) all bundled ELF GLIBC requirements <= 2.28.
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download Readest AppImage
        run: |
          curl -sL -o readest.AppImage \
            https://github.com/readest/readest/releases/download/v0.12.10/Readest_0.12.10_aarch64.AppImage
          ls -la readest.AppImage
          file readest.AppImage

      - name: Extract payload (runtime --appimage-extract yields empty dir — use unsquashfs by magic offset)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools >/dev/null 2>&1
          off=$(grep -abo hsqs readest.AppImage | head -1 | cut -d: -f1)
          echo "squashfs magic offset: ${off:-NOT FOUND}"
          if [ -n "$off" ]; then
            unsquashfs -q -o "$off" -d rootfs readest.AppImage
          else
            echo "no squashfs magic — erofs magic offsets:"
            grep -abo $'\xe0\xf5\xe1\xe2' readest.AppImage | head -3 || echo none
            exit 1
          fi
          echo "=== payload root:"
          ls -la rootfs/ | head -20
          du -sh rootfs

      - name: Report bundled shared libraries
        run: |
          echo "=== all bundled .so files:"
          find rootfs -name '*.so*' | sort
          echo
          echo "=== any webkit bundled?"
          find rootfs -name '*webkit*' -o -name '*WebKit*' | head

      - name: Report main binary system dependencies
        run: |
          bin=$(find rootfs -type f -name 'readest' ! -path '*/lib/*' | head -1)
          [ -z "$bin" ] && bin=$(find rootfs -maxdepth 3 -type f -executable | head -1)
          echo "main binary: $bin"
          file "$bin"
          echo "--- NEEDED entries:"
          readelf -d "$bin" | grep NEEDED
          echo "--- any NEEDED on libwebkit2gtk?"
          readelf -d "$bin" | grep -c webkit || echo "0"

      - name: GLIBC requirements of all bundled ELF files
        run: |
          find rootfs \( -name '*.so*' -o -type f -executable \) -print0 \
            | xargs -0 grep -haoE 'GLIBC_2\.[0-9]+|GLIBCXX_[0-9.]+' 2>/dev/null \
            | sort -uV | tail -15
          max=$(find rootfs \( -name '*.so*' -o -type f -executable \) -print0 \
            | xargs -0 grep -haoE 'GLIBC_2\.[0-9]+' 2>/dev/null | sort -uV | tail -1)
          echo "max GLIBC requirement: ${max:-none}"
