name: build-arm64-debian11

# Build Koodo Reader arm64 AppImage with all native modules compiled against
# glibc 2.28 (UBI8 / RHEL8 baseline) — target machine is UOS V20 (Debian 10,
# glibc 2.28). Upstream builds on ubuntu-24.04-arm (glibc 2.39).
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: registry.access.redhat.com/ubi8/ubi:latest
    steps:
      - name: Install toolchain (UBI8 glibc 2.28; node22 official binaries are RHEL8-built)
        run: |
          set -eux
          dnf -y install dnf-plugins-core >/dev/null
          dnf -y module enable python39 >/dev/null
          dnf -y install python39 tar xz gzip bzip2 make gcc gcc-c++ >/dev/null
          ln -sf /usr/bin/python3.9 /usr/local/bin/python3
          node_tar=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/ \
            | grep -oE 'node-v22\.[0-9]+\.[0-9]+-linux-arm64\.tar\.xz' | head -1)
          curl -fsSLO "https://nodejs.org/dist/latest-v22.x/$node_tar"
          tar -xJf "$node_tar" -C /usr/local --strip-components=1
          node --version && python3 --version && gcc --version | head -1

      - uses: actions/checkout@v4

      - name: Install npm dependencies (yarn.lock pins better-sqlite3 11.6.0)
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Target Linux arm64 AppImage only
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));
            p.build.linux.target=[{target:"AppImage",arch:["arm64"]}];
            fs.writeFileSync("package.json",JSON.stringify(p,null,2))'

      - name: Build web assets (react-scripts build -> build/)
        run: yarn build

      - name: Package
        run: npx electron-builder --linux --arm64 --publish never
        env:
          USE_HARD_LINKS: "false"

      - name: Verify glibc requirements (must be <= GLIBC_2.28)
        run: |
          appimg=$(ls dist/*.AppImage)
          echo "artifact: $appimg"
          chmod +x "$appimg"
          "$appimg" --appimage-extract > /dev/null
          echo "--- assert web assets are inside asar:"
          npx --yes @electron/asar list squashfs-root/resources/app.asar | grep -q 'build/index.html' \
            || { echo "FAIL: build/index.html missing from app.asar"; exit 1; }
          echo "asar contains build/index.html"
          echo "--- top version requirements across all bundled ELF files:"
          find squashfs-root \( -name '*.so*' -o -name '*.node' \) -print0 \
            | xargs -0 grep -haoE 'GLIBC_2\.[0-9]+|GLIBCXX_[0-9.]+' 2>/dev/null \
            | sort -uV | tail -15
          max=$(find squashfs-root \( -name '*.so*' -o -name '*.node' \) -print0 \
            | xargs -0 grep -haoE 'GLIBC_2\.[0-9]+' 2>/dev/null | sort -uV | tail -1)
          echo "max GLIBC requirement: ${max:-none}"
          [ "$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)" = "GLIBC_2.28" ] \
            || { echo "FAIL: requires $max > GLIBC_2.28"; exit 1; }
          echo "PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: koodo-arm64-glibc228
          path: dist/*.AppImage
          if-no-files-found: error
