name: build-arm64-debian11

# Build Koodo Reader arm64 AppImage with all native modules compiled against
# glibc 2.31 (Debian 11), instead of upstream's ubuntu-24.04-arm (glibc 2.39).
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: node:20-bullseye
    steps:
      - name: Install build dependencies (bullseye is EOL — use archive.debian.org)
        run: |
          printf 'deb [trusted=yes] http://archive.debian.org/debian bullseye main\ndeb [trusted=yes] http://archive.debian.org/debian-security bullseye-security main\n' > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends build-essential python3

      - uses: actions/checkout@v4

      - name: Install npm dependencies (yarn.lock pins better-sqlite3 11.6.0)
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Target Linux arm64 AppImage only
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));
            p.build.linux.target=[{target:"AppImage",arch:["arm64"]}];
            fs.writeFileSync("package.json",JSON.stringify(p,null,2))'

      - name: Build
        run: npx electron-builder --linux --arm64 --publish never
        env:
          USE_HARD_LINKS: "false"

      - name: Verify glibc requirements (must be <= GLIBC_2.31)
        run: |
          appimg=$(ls dist/*.AppImage)
          echo "artifact: $appimg"
          chmod +x "$appimg"
          "$appimg" --appimage-extract > /dev/null
          echo "--- top version requirements across all bundled ELF files:"
          find squashfs-root \( -name '*.so*' -o -name '*.node' \) -print0 \
            | xargs -0 grep -haoE 'GLIBC_2\.[0-9]+|GLIBCXX_[0-9.]+' 2>/dev/null \
            | sort -uV | tail -15
          max=$(find squashfs-root \( -name '*.so*' -o -name '*.node' \) -print0 \
            | xargs -0 grep -haoE 'GLIBC_2\.[0-9]+' 2>/dev/null | sort -uV | tail -1)
          echo "max GLIBC requirement: ${max:-none}"
          [ "$(printf '%s\nGLIBC_2.31\n' "$max" | sort -V | tail -1)" = "GLIBC_2.31" ] \
            || { echo "FAIL: requires $max > GLIBC_2.31"; exit 1; }
          echo "PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: koodo-arm64-glibc231
          path: dist/*.AppImage
          if-no-files-found: error
