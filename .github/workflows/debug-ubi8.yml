name: debug-ubi8-toolchain

# One-off: why is gcc-toolset-12 not providing gcc/g++ in the UBI8 container?
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-24.04-arm
    container: registry.access.redhat.com/ubi8/ubi:latest
    steps:
      - run: |
          set -x
          grep -E '^\[' /etc/yum.repos.d/*.repo
          dnf info gcc-toolset-12 2>&1 | head -25
          dnf -y install gcc-toolset-12 2>&1 | tail -30
          ls /opt/rh/gcc-toolset-12/root/usr/bin/ 2>/dev/null | head -25 || echo "TOOLSET_BIN_MISSING"
          which -a gcc g++ cc ar || true
          rpm -qa | grep -iE 'gcc|toolset|binutils' | head -15
          gcc --version 2>&1 | head -1 || true
          g++ --version 2>&1 | head -1 || true
